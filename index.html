<style>
/* Layout: phone-first single column, sticky top strip, fixed 4-tab bar at the bottom like a transit app. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --fg:#171C28; --muted:#6B7280; --line:#E2E5EC;
  --accent:#D9372B; --accent-fg:#FFFFFF; --accent-soft:#FBE9E6;
  --ok:#1E8E5A; --ok-soft:#E3F3EA; --warn:#B7791F; --warn-soft:#FBF1DC;
  --chip:#EBEDF2; --shadow:0 1px 2px rgba(23,28,40,.06),0 6px 16px rgba(23,28,40,.05);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1B1F28; --fg:#E9EBF1; --muted:#9AA1B0; --line:#2B3140;
  --accent:#F05A4D; --accent-fg:#FFFFFF; --accent-soft:#3A1F1D;
  --ok:#4CC38A; --ok-soft:#173226; --warn:#E0A94B; --warn-soft:#352A14;
  --chip:#262B36; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B1F28; --fg:#E9EBF1; --muted:#9AA1B0; --line:#2B3140;
  --accent:#F05A4D; --accent-fg:#FFFFFF; --accent-soft:#3A1F1D;
  --ok:#4CC38A; --ok-soft:#173226; --warn:#E0A94B; --warn-soft:#352A14;
  --chip:#262B36; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand .dates{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.dday{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--accent);color:var(--accent-fg);padding:2px 8px;border-radius:999px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip .sub{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}

/* main */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 20px);max-width:720px;margin:0 auto}
.panel[hidden]{display:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 8px}
.sec-h:first-child{margin-top:0}
.sec-h h2{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sec-h .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:58px 1fr;gap:10px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 12px 10px;min-width:0}
.ev .t{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);line-height:1.3;padding-top:2px}
.ev .t small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.ev .b{min-width:0}
.ev .place{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev .title{font-weight:600;font-size:15px;margin-top:1px;white-space:pre-line}
.ev.big .title{font-size:16px}
.ev .more{margin-top:6px;font-size:13px;color:var(--muted);text-align:left;display:inline-flex;align-items:center;gap:4px}
.ev .more::before{content:"▸";font-size:11px}
.ev .more[aria-expanded="true"]::before{content:"▾"}
.det{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.det p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.det .k{font-weight:600;font-size:12px;color:var(--muted);margin-top:4px}
.det a{color:var(--accent);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--fg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* cards (food/places) */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:inherit;font-size:15px}
.search input::placeholder{color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;min-width:0}
.card.done{opacity:.55}
.card .n{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.card.done .n{text-decoration:line-through}
.card .meta{grid-column:1;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.card .meta .h{font-family:var(--mono);font-size:12px}
.card .note{grid-column:1;font-size:13px;margin-top:2px;white-space:pre-line;overflow-wrap:anywhere}
.card .acts{grid-column:1 / -1;display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.card .chk{grid-column:2;grid-row:1;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent;align-self:start}
.card.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:500;text-decoration:none;background:var(--surface)}
.btn.map{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.stars{color:var(--warn);letter-spacing:.05em;font-size:12px}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}

/* memo */
.memo{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;min-width:0}
.memo h3{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.memo p{margin:0 0 6px;font-size:14px;white-space:pre-line;overflow-wrap:anywhere}
.memo p:last-child{margin-bottom:0}
.memo a{color:var(--accent);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.flight:last-of-type{border-bottom:0}
.flight .ap{font-weight:700;font-size:18px}
.flight .tm{font-family:var(--mono);font-size:14px;font-weight:600}
.flight .sm{font-size:11.5px;color:var(--muted)}
.flight .arrow{color:var(--muted);text-align:center;font-size:12px;line-height:1.3}
.flight .r{text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:600;font-size:14px;background:var(--chip);padding:3px 10px;border-radius:8px}
.copy small{font-family:var(--sans);font-weight:500;font-size:11px;color:var(--muted)}
.steps{margin:0;padding-left:20px;font-size:14px}
.steps li{margin-bottom:4px}
.cl{display:flex;flex-direction:column;gap:2px}
.cl label{display:flex;align-items:flex-start;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.cl label:last-child{border-bottom:0}
.cl input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ok);flex:0 0 auto}
.cl input:checked + span{color:var(--muted);text-decoration:line-through}
.cost{width:100%;border-collapse:collapse;font-size:13.5px}
.cost td{padding:6px 0;border-bottom:1px solid var(--line)}
.cost tr:last-child td{border-bottom:0;font-weight:700}
.cost td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cost td.who{color:var(--muted);font-size:12px;text-align:right;padding-left:8px;white-space:nowrap}
.sub-h{font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.sub-h:first-of-type{margin-top:0}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion:no-preference){ .det{animation:fade .18s ease-out} @keyframes fade{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}} }
@media (min-width:600px){ .cards{display:grid;grid-template-columns:1fr 1fr} .card{align-content:start} }
</style>

/* ---------- STATE ---------- */
const KEY='tokyo1024.v1';
let state={tab:'plan', day:null, farea:'전체', pgroup:'전체', done:{}, pack:{}, open:{}};
try{ Object.assign(state, JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mapUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* D-day */
(function(){
 const t=new Date(); t.setHours(0,0,0,0);
 const s=new Date(2026,9,24), e=new Date(2026,9,28);
 const diff=Math.round((s-t)/864e5);
 const el=document.getElementById('dday');
 if(diff>0) el.textContent='D-'+diff;
 else if(t<=e) el.textContent=(Math.round((t-s)/864e5)+1)+'일차';
 else el.textContent='다녀옴';
})();

/* ---------- RENDER: sub chips ---------- */
function renderChips(){
 const box=document.getElementById('subchips'); box.innerHTML='';
 let list=[];
 if(state.tab==='plan') list=DAYS.map(d=>({id:d.date,label:`${d.n}일차`,sub:`${d.date.slice(5).replace('-','.')} ${d.w}`,on:d.date===state.day}));
 else if(state.tab==='food') list=['전체',...FOOD_AREAS].map(a=>({id:a,label:a,sub:a==='전체'?FOOD.length:FOOD.filter(f=>f.a===a).length,on:a===state.farea}));
 else if(state.tab==='place') list=['전체',...PLACE_GROUPS].map(a=>({id:a,label:a,on:a===state.pgroup}));
 else list=[{id:'flight',label:'항공'},{id:'hotel',label:'숙소·이동'},{id:'studio',label:'스튜디오'},{id:'pack',label:'챙길 것'},{id:'cost',label:'비용'}];
 if(!list.length){box.style.display='none';return} box.style.display='';
 list.forEach(c=>{
  const b=document.createElement('button'); b.className='chip'; b.setAttribute('aria-pressed',String(!!c.on));
  b.innerHTML=esc(c.label)+(c.sub!==undefined?`<span class="sub">${esc(c.sub)}</span>`:'');
  b.onclick=()=>{
   if(state.tab==='plan') state.day=c.id; else if(state.tab==='food') state.farea=c.id; else if(state.tab==='place') state.pgroup=c.id;
   else { document.getElementById('m-'+c.id)?.scrollIntoView({behavior:'smooth',block:'start'}); return; }
   save(); render();
  };
  box.appendChild(b);
 });
 const on=box.querySelector('[aria-pressed="true"]'); if(on) on.scrollIntoView({inline:'center',block:'nearest'});
}

function detHtml(d){
 return d.map(x=>{
  if(typeof x==='string') return `<p>${esc(x)}</p>`;
  if(x.k) return `<div class="k">${esc(x.k)}</div>`;
  if(x.l) return `<p><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.l)} ↗</a></p>`;
  return '';
 }).join('');
}
function renderPlan(){
 const box=document.getElementById('p-plan');
 const day=DAYS.find(d=>d.date===state.day)||DAYS[0];
 box.innerHTML=`<div class="sec-h"><h2>${day.n}일차 · ${day.date.slice(5).replace('-','월 ')}일 ${day.w}요일</h2><span class="cnt">${day.items.length}개</span></div><div class="tl"></div>`;
 const tl=box.querySelector('.tl');
 day.items.forEach((it,i)=>{
  const id=day.date+'-'+i; const open=!!state.open[id];
  const el=document.createElement('article'); el.className='ev'+(it.big?' big':'');
  el.innerHTML=`<div class="t">${esc(it.t||'—')}${it.ts?`<small>${esc(it.ts)}</small>`:''}</div>
   <div class="b">
    <div class="place">${it.p?`<span>${esc(it.p)}</span>`:''}${(it.pills||[]).map(p=>`<span class="pill ${/예약|필수|도착/.test(p)?'warn':'acc'}">${esc(p)}</span>`).join('')}</div>
    <div class="title">${esc(it.title)}</div>
    ${it.d&&it.d.length?`<button class="more" aria-expanded="${open}">자세히</button><div class="det" ${open?'':'hidden'}>${detHtml(it.d)}</div>`:''}
   </div>`;
  const btn=el.querySelector('.more');
  if(btn) btn.onclick=()=>{ const det=el.querySelector('.det'); det.hidden=!det.hidden; btn.setAttribute('aria-expanded',String(!det.hidden)); state.open[id]=!det.hidden; save(); };
  tl.appendChild(el);
 });
}

/* ---------- RENDER: cards ---------- */
function cardHtml(item,id){
 const done=!!state.done[id];
 const meta=[];
 if(item.k) meta.push(`<span>${esc(item.k)}</span>`);
 if(item.h) meta.push(`<span class="h">${esc(item.h)}</span>`);
 if(item.pr) meta.push(`<span>${esc(item.pr)}</span>`);
 if(item.s) meta.push(`<span class="stars">${'★'.repeat(item.s)}${'☆'.repeat(5-item.s)}</span>`);
 const note=[item.loc,item.note].filter(Boolean).join('\n');
 return `<article class="card${done?' done':''}" data-id="${esc(id)}">
  <div class="n">${esc(item.n)}${item.res?` <span class="pill warn">${esc(item.res)}</span>`:''}</div>
  <button class="chk" aria-label="다녀옴 표시" aria-pressed="${done}">✓</button>
  <div class="meta">${meta.join('')}</div>
  ${note?`<div class="note">${esc(note)}</div>`:''}
  <div class="acts"><a class="btn map" href="${mapUrl(item.q||item.n+' 東京')}" target="_blank" rel="noopener">지도 열기 ↗</a>${item.link?`<a class="btn" href="${esc(item.link)}" target="_blank" rel="noopener">링크 ↗</a>`:''}</div>
 </article>`;
}
function bindCards(root){
 root.querySelectorAll('.chk').forEach(b=>b.onclick=()=>{
  const card=b.closest('.card'); const id=card.dataset.id;
  state.done[id]=!state.done[id]; if(!state.done[id]) delete state.done[id]; save();
  card.classList.toggle('done',!!state.done[id]); b.setAttribute('aria-pressed',String(!!state.done[id]));
 });
}
function renderFood(){
 const q=(document.getElementById('q-food').value||'').trim().toLowerCase();
 const box=document.getElementById('food-list');
 const list=FOOD.filter(f=>(state.farea==='전체'||f.a===state.farea)&&(!q||[f.n,f.k,f.note,f.a,f.loc].join(' ').toLowerCase().includes(q)));
 if(!list.length){box.innerHTML='<div class="empty">검색 결과가 없어요</div>';return}
 if(state.farea==='전체'&&!q){
  box.innerHTML=''; box.style.display='block';
  FOOD_AREAS.forEach(a=>{
   const sub=list.filter(f=>f.a===a); if(!sub.length) return;
   const w=document.createElement('div');
   w.innerHTML=`<div class="sec-h"><h2>${esc(a)}</h2><span class="cnt">${sub.length}</span></div><div class="cards">${sub.map(f=>cardHtml(f,'f:'+f.n)).join('')}</div>`;
   box.appendChild(w);
  });
 } else { box.style.display=''; box.innerHTML=list.map(f=>cardHtml(f,'f:'+f.n)).join(''); }
 bindCards(box);
}
function renderPlace(){
 const q=(document.getElementById('q-place').value||'').trim().toLowerCase();
 const box=document.getElementById('place-list');
 const list=PLACES.filter(p=>(state.pgroup==='전체'||p.g===state.pgroup)&&(!q||[p.n,p.k,p.loc,p.g].join(' ').toLowerCase().includes(q)));
 if(!list.length){box.innerHTML='<div class="empty">검색 결과가 없어요</div>';return}
 box.innerHTML='';
 PLACE_GROUPS.forEach(g=>{
  const sub=list.filter(p=>p.g===g); if(!sub.length) return;
  const w=document.createElement('div');
  w.innerHTML=`<div class="sec-h"><h2>${esc(g)}</h2><span class="cnt">${sub.length}</span></div><div class="cards">${sub.map(p=>cardHtml(p,'p:'+p.n)).join('')}</div>`;
  box.appendChild(w);
 });
 bindCards(box);
}

/* ---------- TABS ---------- */
function render(){
 document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+state.tab);
 document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===state.tab)));
 renderChips();
 if(state.tab==='plan') renderPlan();
 else if(state.tab==='food') renderFood();
 else if(state.tab==='place') renderPlace();
 else renderMemo();
}
document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; save(); render(); window.scrollTo({top:0}); });
document.getElementById('q-food').addEventListener('input',renderFood);
document.getElementById('q-place').addEventListener('input',renderPlace);

/* auto-pick today's day while traveling, else remembered or day 1 */
(function(){
 const t=todayStr();
 if(DAYS.some(d=>d.date===t)) state.day=t;
 else if(!DAYS.some(d=>d.date===state.day)) state.day=DAYS[0].date;
 const h=(location.hash||'').slice(1); if(['plan','food','place','memo'].includes(h)) state.tab=h;
})();
render();
