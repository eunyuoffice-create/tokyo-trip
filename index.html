<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F5F8">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="ledger.css">
</head>
<body>
<title>도쿄 여행 10.24</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column, sticky top strip, fixed 4-tab bar at the bottom like a transit app. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --fg:#171C28; --muted:#6B7280; --line:#E2E5EC;
  --accent:#D9372B; --accent-fg:#FFFFFF; --accent-soft:#FBE9E6;
  --ok:#1E8E5A; --ok-soft:#E3F3EA; --warn:#B7791F; --warn-soft:#FBF1DC;
  --chip:#EBEDF2; --shadow:0 1px 2px rgba(23,28,40,.06),0 6px 16px rgba(23,28,40,.05);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tab-h:64px;
}
/* 테마는 기기 설정과 무관하게 항상 밝은 배경 (2026-10-20 결정) */
:root{color-scheme:light}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top strip */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 10px;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand .dates{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.dday{font-family:var(--mono);font-size:12px;font-weight:600;background:var(--accent);color:var(--accent-fg);padding:2px 8px;border-radius:999px}
.chips:empty{display:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:0;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chip .sub{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}

/* main */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 20px);max-width:720px;margin:0 auto}
.panel[hidden]{display:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 8px}
.sec-h:first-child{margin-top:0}
.sec-h h2{margin:0;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sec-h .cnt{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* timeline */
.tl{display:flex;flex-direction:column;gap:10px}
.toolrow{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap;align-items:center}
.wx{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;flex:1 1 100%;min-width:0;padding-bottom:2px;margin-inline:-16px;padding-inline:16px}
.wx::-webkit-scrollbar{display:none}
.wx-day{flex:0 0 auto;display:flex;align-items:center;gap:4px;height:32px;padding:0 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.wx-day[aria-pressed="true"]{border-color:var(--fg);color:var(--fg)}
.wx-day .wt{font-family:var(--mono);color:var(--fg)} .wx-day .wt b{font-weight:600}
.wx-day .wp{font-size:11px;color:#2F5FB3}
.wx-note{font-size:11px;color:var(--muted);white-space:nowrap;padding-left:4px}
@media (min-width:900px){.wx{flex:1 1 auto;margin-inline:0;padding-inline:0}.wx-day{height:36px;font-size:13.5px;padding:0 12px}.wx-note{font-size:12.5px}}
.btn.tool{background:var(--surface);border-color:var(--line);font-weight:600;padding:5px 10px;font-size:11.5px;color:var(--muted)}
#infobox{position:fixed;inset:0;z-index:60}
#infobox[hidden]{display:none}
#infobox .ib-scrim{position:absolute;inset:0;background:rgba(23,28,40,.45)}
#infobox .ib-card{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
#infobox .ib-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
#infobox .ib-head h2{margin:0;font-size:17px;font-weight:700}
#infobox .ib-x{height:32px;padding:0 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600}
#infobox .ib-body{overflow:auto;padding:12px 16px 20px;font-size:14px;line-height:1.55}
.ib-note{margin:0 0 10px;font-size:12.5px;color:var(--muted)}
.ib-img{display:block;width:100%;max-width:560px;margin:0 auto;border-radius:10px;background:#fff}
.ib-grid{display:grid;grid-template-columns:1fr;gap:8px}
.ib-item{background:var(--bg);border-radius:12px;padding:10px 12px}
.ib-item.hl{background:var(--warn-soft)}
.ib-item h3{margin:0 0 6px;font-size:14.5px;font-weight:700}
.ib-item h3 small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.ib-row{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin-top:4px;color:var(--fg)}
.ib-row span:last-child{flex:1;min-width:0;color:var(--muted)}
.ib-tag{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--chip)}
.ib-tag.ok{background:var(--ok-soft);color:var(--ok)} .ib-tag.no{background:var(--accent-soft);color:var(--accent)}
.kcbanner{background:var(--fg);color:var(--bg);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.kcbanner .kcb-k{font-size:12px;opacity:.8;letter-spacing:.02em} .kcbanner .kcb-k small{margin-left:4px;opacity:.8}
.kcbanner .kcb-v{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:2px 0 4px} .kcbanner .kcb-v small{font-family:var(--sans);font-size:13px;font-weight:500;opacity:.8;margin-left:4px}
.kcbanner .kcb-s{font-size:12.5px;opacity:.9;line-height:1.5}
.kct{border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13px;background:var(--surface)}
.kcrow{display:grid;grid-template-columns:1.7fr .8fr .6fr .7fr;align-items:center;border-top:1px solid var(--line);cursor:pointer}
.kcrow:first-child{border-top:0}
.kcrow>div{padding:9px 6px;display:flex;align-items:center;justify-content:center;min-width:0}
.kcrow .kcn{justify-content:flex-start;flex-direction:column;align-items:flex-start;gap:1px;font-weight:600;line-height:1.3;padding-left:12px;position:relative}
.kcrow .kcn small{font-size:11px;color:var(--muted);font-weight:500}
.kcrow.kchead{background:var(--bg);cursor:default} .kcrow.kchead>div{font-size:11.5px;font-weight:700;color:var(--muted);padding:7px 6px} .kcrow.kchead .kcn{padding-left:12px}
.kcrow:nth-child(odd):not(.kchead){background:#FAFAF8}
.kcrow .kcdet{display:none;grid-column:1 / -1;justify-content:flex-start;font-size:13px;line-height:1.6;color:var(--fg);padding:4px 12px 12px;white-space:pre-line;border-top:1px dashed var(--line);margin-top:2px}
.kcrow.open{background:var(--accent-soft)} .kcrow.open .kcdet{display:block}
.kcrow .kcn::after{content:"▾";position:absolute;right:2px;top:9px;font-size:10px;color:var(--line)} .kcrow.open .kcn::after{content:"▴";color:var(--accent)}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 6px;border-radius:7px;font-size:12.5px;font-weight:800}
.kc.ok{background:var(--ok-soft);color:var(--ok)} .kc.no{background:var(--accent-soft);color:var(--accent)} .kc.mid{background:var(--warn-soft);color:var(--warn);font-size:11.5px}
.kcrow.open .kc{box-shadow:0 0 0 1px rgba(255,255,255,.6) inset}
@media (min-width:900px){.kct{font-size:14.5px}.kcrow .kcn small{font-size:12.5px}.kcrow .kcdet{font-size:14.5px}.kcbanner .kcb-v{font-size:34px}}
.ib-tag.bag{background:var(--chip);color:var(--fg)}
.ib-tag.mid{background:var(--warn-soft);color:var(--warn)}
.ib-bagrow span:last-child .ib-tag{margin-right:4px;font-size:11px}
.ib-bagrow{align-items:flex-start}
.ib-h{margin:16px 0 6px;font-size:14px;font-weight:700}
.ib-ul{margin:0;padding-left:18px} .ib-ul li{margin:3px 0}
.ib-src{margin:14px 0 0;font-size:12px;color:var(--muted)} .ib-src a{color:var(--accent)}
@media (min-width:900px){#infobox .ib-card{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:720px;max-height:86vh;border-radius:20px;padding-bottom:0}.ib-grid{grid-template-columns:1fr 1fr}#infobox .ib-body{font-size:15.5px;padding:16px 22px 24px}.ib-row{font-size:14.5px}.ib-item h3{font-size:16px}}
#lightbox{position:fixed;inset:0;z-index:60;background:rgba(23,28,40,.88);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lightbox[hidden]{display:none}
#lightbox img{max-width:min(100%,560px);max-height:92vh;border-radius:12px;background:#fff;object-fit:contain}
#lightbox .lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:16px}
.ev{position:relative;display:grid;grid-template-columns:58px 1fr;gap:10px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 12px 10px;min-width:0}
.ev .t{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);line-height:1.3;padding-top:2px}
.ev .t small{display:block;font-size:10px;color:var(--muted);font-weight:500}
.ev .b{min-width:0}
.ev .place{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ev .title{font-weight:600;font-size:15px;margin-top:1px;white-space:pre-line}
.ev.big .title{font-size:16px}
.ev .route{margin-top:7px;padding:7px 9px;background:var(--chip);border-radius:9px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;line-height:1.45}
.ev .route .rf{font-weight:600;color:var(--fg)}
.ev .route .rh{white-space:pre-line}
.ev .route a{color:var(--accent);font-weight:600;text-decoration:none;align-self:flex-start;margin-top:2px}
.ev .route .rprice{font-family:var(--mono);font-weight:600;color:var(--fg);background:var(--surface);border-radius:6px;padding:0 6px;margin-left:4px;font-size:12px}
.ev .route .racts{display:flex;gap:10px;flex-wrap:wrap}
.ev .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn.link{border-color:transparent;background:#E3ECFB;color:#2F5FB3}
.ev .more{margin-top:6px;font-size:13px;color:var(--muted);text-align:left;display:inline-flex;align-items:center;gap:4px}
.ev .more::before{content:"▸";font-size:11px}
.ev .more[aria-expanded="true"]::before{content:"▾"}
.det{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;line-height:1.55;display:flex;flex-direction:column;gap:8px}
.det p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.det .k{font-weight:600;font-size:12px;color:var(--muted);margin-top:4px}
.det a{color:var(--accent);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.autolink{color:#2F5FB3;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere;font-weight:500}
.pill{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--fg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:var(--chip);color:var(--muted)}
.pill.tag{background:#E3ECFB;color:#2F5FB3}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 12px;white-space:pre-line;line-height:1.5}

/* cards (food/places) */
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:inherit;font-size:15px}
.search input::placeholder{color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 12px 10px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;min-width:0}
.card.done{opacity:.55}
.card .n{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.card.done .n{text-decoration:line-through}
.card .meta{grid-column:1;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.card .meta .h{font-family:var(--mono);font-size:12px}
.card .note{grid-column:1;font-size:13px;line-height:1.55;margin-top:4px;white-space:pre-line;overflow-wrap:anywhere;color:var(--fg)}
.card .meta .h{flex-basis:100%}
.card .acts{grid-column:1 / -1;display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.card .chk{grid-column:2;grid-row:1;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent;align-self:start}
.card.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:500;text-decoration:none;background:var(--surface)}
.btn.map{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.stars{color:var(--warn);letter-spacing:.05em;font-size:12px}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:14px}
.seg{display:flex;gap:3px;background:var(--chip);border-radius:11px;padding:3px;margin:0 0 12px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.10)}
.seg button .sub{font-family:var(--mono);font-size:11px;font-weight:500;opacity:.7;margin-left:3px}
.seg.seg-tag{margin-top:-6px;background:none;padding:0;gap:6px;flex-wrap:wrap}
.seg.seg-tag button{flex:0 0 auto;padding:5px 11px;border-radius:999px;background:var(--chip);font-size:12.5px;font-weight:600;color:var(--muted)}
.seg.seg-tag button[aria-pressed="true"]{background:#2F5FB3;color:#fff;box-shadow:none}
.type-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.type-h::after{content:"";flex:1;height:1px;background:var(--line)}
.type-h:first-child{margin-top:0}
.type-h .cnt{font-family:var(--mono);font-weight:500}

/* memo */
.memo{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:10px;min-width:0}
.memo h3{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.memo p{margin:0 0 10px;font-size:14px;line-height:1.6;white-space:pre-line;overflow-wrap:anywhere}
.memo p:last-child{margin-bottom:0}
.memo b,.cl label b{color:var(--accent);font-weight:700}
.memo p b{margin-right:4px}
.memo .tm{font-family:var(--mono);font-size:12.5px;color:var(--fg);background:var(--chip);padding:0 5px;border-radius:5px;white-space:nowrap}
.memo .ch{display:inline-block;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:3px 6px 3px 0;font-size:13px;line-height:1.45;color:var(--fg)}
.memo .ch .tm{background:transparent;padding:0}
.memo .sub-h{font-size:13px;font-weight:700;color:var(--fg);padding-left:8px;border-left:3px solid var(--accent);margin:18px 0 8px;line-height:1.3}
.memo .cl label{padding:9px 0}
.memo .cl label span{display:block}
.cl img.thumb{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
details.memo summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;-webkit-tap-highlight-color:transparent}
details.memo summary::-webkit-details-marker{display:none}
details.memo summary h3{margin:0;flex:1;min-width:0}
details.memo summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 6px 4px 0;flex:0 0 auto;transition:transform .15s}
details.memo[open] summary::after{transform:rotate(-135deg);margin:4px 6px 0 0}
details.memo[open] summary{margin-bottom:10px}
.memo a{color:var(--accent);text-decoration:none;font-weight:500;overflow-wrap:anywhere}
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.flight:last-of-type{border-bottom:0}
.flight .ap{font-weight:700;font-size:18px}
.flight .tm{font-family:var(--mono);font-size:14px;font-weight:600}
.flight .sm{font-size:11.5px;color:var(--muted)}
.flight .arrow{color:var(--muted);text-align:center;font-size:12px;line-height:1.3}
.flight .r{text-align:right}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:2px}
.kv dd{margin:0;overflow-wrap:anywhere}
.copy{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-weight:600;font-size:14px;background:var(--chip);padding:3px 10px;border-radius:8px}
.copy small{font-family:var(--sans);font-weight:500;font-size:11px;color:var(--muted)}
.steps{margin:0;padding-left:20px;font-size:14px}
.steps li{margin-bottom:4px}
.cl{display:flex;flex-direction:column;gap:2px}
.cl label{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.5;padding:8px 0;border-bottom:1px solid var(--line)}
.cl label span{min-width:0;white-space:pre-line}
.cl label b{display:block;margin-bottom:1px}
.cl label:last-child{border-bottom:0}
.cl input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ok);flex:0 0 auto}
.cl input:checked + span{color:var(--muted);text-decoration:line-through}
.cost{width:100%;border-collapse:collapse;font-size:13.5px}
.cost td{padding:6px 0;border-bottom:1px solid var(--line)}
.cost tr:last-child td{border-bottom:0;font-weight:700}
.cost td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cost td.who{color:var(--muted);font-size:12px;text-align:right;padding-left:8px;white-space:nowrap}
.cmp{width:100%;border-collapse:collapse;font-size:13px}
.cmp th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:4px 0;border-bottom:1px solid var(--line)}
.cmp td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cmp tr:last-child td{border-bottom:0}

:root{--bg:#F6F6F3;--surface:#FFFFFF;--fg:#1B1F27;--muted:#5F6775;--line:#E4E4DF;--chip:#EEEEE9;--accent-soft:#FBEAE7;--shadow:0 1px 1px rgba(27,31,39,.04),0 2px 8px rgba(27,31,39,.04)}

.seg{border-radius:12px}
.seg button{font-size:13.5px;padding:8px 4px}
.hint{font-size:12.5px}

.memo{border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px}

  {t:'10:00', ts:'~10:30 도착', p:'이케부쿠로 → 도시마엔', r:[{f:'이케부쿠로역', t:'스튜디오 투어 도쿄', how:'세이부 이케부쿠로선 → 네리마에서 도시마선 환승 (직통도 있음) 약 20분 + 도시마엔역 도보 2분. 10:00 출발이면 여유', fq:'池袋駅', tq:'ワーナー ブラザース スタジオツアー東京', mode:'transit'},{f:'호텔 레솔 이케부쿠로', t:'스튜디오 투어 도쿄', how:'택시 약 25~35분 · 3,500~5,000엔 (약 7~8km, 둘이 나누면 1인 2,000엔대). 짐·의상 많거나 늦었을 때. GO 앱 또는 호텔 앞 승차', fq:'ホテルリソル池袋', tq:'ワーナー ブラザース スタジオツアー東京', mode:'driving'}], title:'해리포터 스튜디오 이동', pills:['11시 전 도착'], d:['이동 경로와 소요시간 재확인 (이케부쿠로 → 스튜디오 30~40분).','비상용 택시: 3,500~5,000엔 예상. 시간은 비슷.','건물 입장 → 보안검사 → 탈의실 → 코인로커 → 입장 순서라 여유 필요.']},

  {t:'~15:00', p:'도시마엔 →', r:[{f:'도시마엔역', t:'이케부쿠로역', how:'A안 · 세이부선 약 20분', fq:'豊島園駅', tq:'池袋駅', mode:'transit'},{f:'스튜디오 투어 도쿄', t:'호텔 레솔 이케부쿠로', how:'A안 택시\n약 25~35분\n3,500~5,000엔. 짐 많으면', fq:'ワーナー ブラザース スタジオツアー東京', tq:'ホテルリソル池袋', mode:'driving'},{f:'도시마엔역', t:'메이지진구마에역 (하라주쿠)', how:'B안 · 세이부선으로 이케부쿠로 → 후쿠토신선 환승 약 45분. 5번 출구가 오모카도 앞', fq:'豊島園駅', tq:'明治神宮前駅', mode:'transit'}], title:'투어 끝나고 두 갈래', d:['A안 이케부쿠로: 세이부 도시마선 → 이케부쿠로 (20~30분). 못 한 쇼핑 마저 하고 야키니쿠.','B안 하라주쿠: 세이부로 이케부쿠로 → 후쿠토신선으로 메이지진구마에 (총 40~45분, 5번 출구가 오모카도 바로 앞). 또는 오에도선 → 신주쿠 → JR 야마노테선 → 하라주쿠 (40분).','일요일이라 하라주쿠 가게들이 20시 전후에 닫으니 B안은 16시 전에 도착하는 게 좋음.']},
  {t:'A안', p:'이케부쿠로', title:'남은 쇼핑 + 야키니쿠 저녁', d:['일요일 영업: 토라노아나 11:00~20:00\nK-BOOKS 11:30~20:00\n만다라케 12:00~20:00\n아니메이트 ~21:00\n파르코 ~21:00','저녁 1순위: 후타고 이케부쿠로 동쪽출구점 (17:00~23:30, 4,000~6,000엔). 역 도보 3분, 직원이 구워줌. 하미데루 카루비는 예약 때 요청.','저녁 2순위: 세이코엔 서쪽출구 본점 (A5 와규, ~23:00, 6,000~7,500엔). 가볍게는 야키니쿠 라이크.',{l:'후타고 이케부쿠로 지도', u:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('大阪焼肉・ホルモン ふたご 池袋東口店')}]},
  {t:'B안', p:'하라주쿠', r:{f:'메이지진구마에역', t:'이케부쿠로역', how:'귀가 · 후쿠토신선 직통 약 15분 (급행 11분). JR 하라주쿠 → 이케부쿠로는 야마노테선 20분', fq:'明治神宮前駅', tq:'池袋駅', mode:'transit'}, title:'하라주쿠 루트 (이 순서대로)', big:true, d:['① 메이지진구마에역 5번 출구 → 라테 포켓 (神宮前4-28, 도보 4분). 일요일은 18시 마감이라 가장 먼저. 캐릭터 3D 라테아트.','② 도큐플라자 오모카도 (5번 출구 바로 앞): 3F 치이카와 베이커리는 15시 이후 정리권이 필요한데 투어 끝나고 오면 늦을 가능성 큼 → 공식 X 확인만 하고, 안 되면 라포레 하라주쿠 B1 치이카와 팝업(자유 입장)으로.','③ 오모테산도 건너편 길로 → 키디랜드 하라주쿠 (神宮前6-1-9, 20:00 마감). 1F 치이카와 랜드 하라주쿠, 케데헌 팝업.','④ 키디랜드 바로 근처 → 도쿄 스네이크 센터 (神宮前6-5-6 8F, 20:00 마감, 입장 1,980엔). 일요일 영업.','⑤ 메이지도리 따라 시부야 방면 → 해리포터 샵 하라주쿠 (6번 출구 옆, 21:00 마감). 가장 늦게까지 하니 마지막에. 혼잡하면 QR 순번 등록.','⑥ 저녁: KINTAN 하라주쿠 (JR 하라주쿠역 도보 2분, 일 17:00~22:00, 코스 6,000엔~) 또는 아오야마 만푸쿠 (네기탄시오, ~23:00). 싸게 먹으려면 시즈루 하라미 정식 (오모카도 뒤, ~1,500엔).','간식 끼우기: 마리온 크레페 (타케시타도리, ~21:00), 아임 도넛 (3번 출구 앞, 품절 시 마감).','귀가: JR 하라주쿠 → 이케부쿠로 야마노테선 20분, 또는 메이지진구마에 → 이케부쿠로 후쿠토신선 15분.']}

 {date:'2026-10-26', w:'월', n:3, items:[

  {t:'1안', p:'', title:'1안 · 아래 그대로 (치이카와 레스토랑 19:00 가는 날)', pills:['기존'], d:['도쿄역 12:10 → 나가노 마켓 15:10 → 하라주쿠 16:10 → 치이카와 레스토랑 19:00 → 귀가 18:20 출발.','치이카와 레스토랑을 안 가면 맨 아래 2안으로.']},
  {t:'12:10', ts:'~15:00', p:'도쿄역', title:'캐릭터 스트리트 → 점심 → 그란스타', big:true, r:[{f:'아카사카미츠케역', t:'도쿄역 캐릭터 스트리트', how:'마루노우치선 직통 약 10분 → 야에스 지하 중앙 개찰구', fq:'赤坂見附駅', tq:'東京キャラクターストリート', mode:'transit'}], d:['① 야에스 지하 중앙 개찰구 앞 一番街 B1 캐릭터 스트리트: 마호도코로 → 치이카와 랜드 → 점프숍\n원피스\n지브리\n산리오(1F) 순으로 한 바퀴. 전 점포 10:00~20:30.','② 점심: 같은 층 라멘스트리트 (로쿠린샤 츠케멘은 줄 김 → 이카루가·소라노이로가 빠름) 또는 오카시랜드 간식.','③ 선물: N.Y. 캐러멜 샌드는 야에스 북쪽 출구 앞 다이마루 1F (하네다 3터미널엔 없음). 버터 버틀러·네코셰프는 기프트팔레트 (야에스 북쪽 개찰 밖).','④ 유라쿠초행 JR 개찰 들어가서 그란스타 (코코리스 · 메이플 매니아 · 프레스 버터 샌드 10주년점) 들른 뒤 야마노테선 탑승.','시간 배분 (약 3시간): 캐릭터 스트리트 1시간 20분 → 점심 50분 → 다이마루·기프트팔레트 선물 30분 → 그란스타 20분. 15:00쯤 유라쿠초행 JR.','치이카와 베이커리 14:50 정리권까지 노리면 도쿄역을 13:30에 떠나야 해서 너무 빠듯함 → 베이커리는 2일차 B안이나 라포레 팝업으로.','선물 목록은 메모 탭 "도쿄역 · 선물" 참고.']},
  {t:'15:10', ts:'~15:40', p:'긴자 (유라쿠초)', title:'나가노 마켓 (시간 되면)', r:{f:'도쿄역', t:'나가노 마켓 (마로니에게이트 긴자1)', how:'JR 야마노테선 유라쿠초 1정거장 2분 + 도보 3분 (또는 도쿄역에서 도보 15분)', fq:'東京駅', tq:'マロニエゲート銀座1', mode:'transit'}, d:['마로니에게이트 긴자1 4F, 11:00~21:00. 평상시 예약 불필요.','10/23 신상 발매 직후라 혼잡할 수 있음. 30분 정도.','도쿄역에서 더 보고 싶으면 패스하고 유라쿠초역에서 바로 하라주쿠행. 하라주쿠를 제대로 보려면 2일차 B안으로.']},
  {t:'16:10', ts:'~18:20', p:'하라주쿠', title:'하라주쿠 핵심만 (이 순서대로)', big:true, r:[{f:'유라쿠초역', t:'하라주쿠역 / 메이지진구마에역', how:'JR 야마노테선 (시부야 방면) 약 25분. 하라주쿠역 오모테산도 출구로 나오기', fq:'有楽町駅', tq:'東急プラザ表参道「オモカド」', mode:'transit'}], d:['① 하라주쿠역 오모테산도 출구 → 라테 포켓 (神宮前4-28, 도보 6분). 평일 18:00 마감이라 가장 먼저. 캐릭터 3D 라테아트 (20분).','② 도큐플라자 오모카도: 3F 치이카와 베이커리는 15시 정리권이 이미 마감됐을 가능성 큼 → 공식 X(@chiikawa_bakery)만 확인. 안 되면 바로 옆 라포레 하라주쿠 B1 치이카와 팝업 (자유 입장, 20분).','③ 오모테산도 건너편 → 키디랜드 하라주쿠 (20:00 마감). 1F 치이카와 랜드, 케데헌 팝업.','④ 스네이크 센터는 이날 패스 (2시간 일정). 2일차 B안으로 하라주쿠를 갔다면 그때.','⑤ 메이지도리 따라 시부야 방면 → 해리포터 샵 하라주쿠 (6번 출구 옆, 21:00 마감). 혼잡하면 입구 QR로 순번 등록.','⑥ 간식: 마리온 크레페 (타케시타도리)\n아임 도넛 (3번 출구 앞)\n더 말차 도쿄 (평일 18:30 마감).','⑦ 18:20 메이지진구마에역에서 후쿠토신선 → 이케부쿠로 (급행 11분). 파르코는 역 직결.']},
  {t:'19:00', p:'이케부쿠로 파르코', title:'치이카와 레스토랑', pills:['예약'], r:{f:'메이지진구마에역', t:'이케부쿠로 파르코', how:'후쿠토신선 직통 약 15분 (급행 11분). 19:00 예약이니 18:20 전 출발', fq:'明治神宮前駅', tq:'池袋PARCO', mode:'transit'}, d:['파르코 본관 7F. 로손티켓 "식사권 포함 정리권" 사전 예약 우선 (판매 기간 9/26~11/20). 1시간제.','같은 건물 8F 치이카와 라멘 "豚"은 14시 이후 예약 없이 가능, B2F 치이카와 랜드.','오후 7시 밖에 선택지가 없을 것 같지만 일단 기입.']},
  {t:'2안', p:'아카사카 → 도쿄역 → 하라주쿠', title:'2안 · 치이카와 레스토랑 안 가는 날 (여유안)', big:true, pills:['점심 없음', '하라주쿠 5시간'], r:[{f:'아카사카미츠케역', t:'도쿄역', how:'마루노우치선 직통 약 10분 → 야에스 지하 중앙 개찰구', fq:'赤坂見附駅', tq:'東京キャラクターストリート', mode:'transit'},{f:'도쿄역', t:'하라주쿠역', how:'JR 야마노테선 (시부야 방면) 직통 약 25분. 오모테산도 출구', fq:'東京駅', tq:'原宿駅', mode:'transit'},{f:'메이지진구마에역', t:'이케부쿠로역', how:'귀가 · 후쿠토신선 직통 약 15분 (급행 11분)', fq:'明治神宮前駅', tq:'池袋駅', mode:'transit'}], d:[
   '카페에서 식사하니 점심은 건너뛰고 14:30쯤 도쿄역에서 간식.',
   {k:'11:50~13:10 아카사카 해리포터 거리'},

   {k:'13:30~15:15 도쿄역'},
   '캐릭터 스트리트 1시간: 치이카와 랜드 → 점프숍 → 지브리 → 산리오. 마호도코로 도쿄역점은 아카사카에서 봤으니 10분만 (상품 구성이 조금 다름).',
   '14:30~15:15 간식 + 선물: 오카시랜드 → 다이마루 1F N.Y. 캐러멜 샌드 → 기프트팔레트 → 그란스타. 선물 목록은 메모 탭.',
   '나가노 마켓(긴자) 넣으려면 도쿄역을 15:00에 끊고 유라쿠초 15:15~15:45 → 하라주쿠 16:15 도착. 라테 포켓은 그래도 됨.',
   {k:'15:45~18:00 하라주쿠 1'},
   '① 하라주쿠역 오모테산도 출구 → 라테 포켓 (18:00 마감이라 첫 번째, 20분).',
   '② 도큐플라자 오모카도 3F 치이카와 베이커리 정리권 확인 (공식 X) → 안 되면 라포레 하라주쿠 B1 치이카와 팝업 (라포레 11:00~20:00, 자유 입장).',

/* ---------- STATE ---------- */
/* 일정·맛집·갈 곳: content.js 가 서버에서 받아오면 이 자리로 들어온다 (없으면 위의 정적 데이터) */
let DB={plan:null,food:null,places:null};
const getDays=()=>DB.plan?DAYS.map(d=>({...d,items:DB.plan.filter(x=>x.day===d.date)})):DAYS;
const getFood=()=>DB.food||FOOD;
const getPlaces=()=>DB.places||PLACES;
const KEY='tokyo1024.v1';
let state={tab:'plan', day:null, farea:'전체', ftype:'전체', ftag:'전체', pgroup:'전체', done:{}, pack:{}, open:{}, mo:{}};
try{ Object.assign(state, JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
/* 공동 결정 사항은 기본 체크 (한 번만) */
if(!state.pack['pk:공통:3'] && !state.packAuto){ state.pack['pk:공통:3']=true; state.packAuto=1; }
/* 저장된 필터가 사라진 지역을 가리키면 전체로 복구 */
if(!['전체',...FOOD_AREAS].includes(state.farea)) state.farea='전체';
if(!FOOD_TYPES.some(t=>t.id===state.ftype)) state.ftype='전체';
if(!['전체',...PLACE_CHIPS].includes(state.pgroup)) state.pgroup='전체';
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 글자 안의 http(s) 주소는 자동으로 새 창 링크 (escape 뒤에 적용) */
const linkify=t=>t.replace(/(https?:\/\/[^\s<>"']+?)([.,)!?]*)(?=\s|$|<)/g,(m,u,tail)=>`<a href="${u}" target="_blank" rel="noopener" class="autolink">${u.replace(/^https?:\/\//,'').slice(0,56)}${u.length>64?'…':''}</a>${tail}`);
const nl=t=>linkify(esc(t).replace(/(?<=[가-힣\)\]])\. (?=\S)/g,'.\n').replace(/ — /g,'\n'));
const mapUrl=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* D-day */
(function(){
 const t=new Date(); t.setHours(0,0,0,0);
 const s=new Date(2026,9,24), e=new Date(2026,9,28);
 const diff=Math.round((s-t)/864e5);
 const el=document.getElementById('dday');
 if(diff>0) el.textContent='D-'+diff;
 else if(t<=e) el.textContent=(Math.round((t-s)/864e5)+1)+'일차';
 else el.textContent='다녀옴';
})();

function renderChips(){
 const box=document.getElementById('subchips'); box.innerHTML='';

  const u=`https://api.open-meteo.com/v1/forecast?latitude=35.6895&longitude=139.6917&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=Asia%2FTokyo&start_date=${DAYS[0].date}&end_date=${DAYS[DAYS.length-1].date}`;
  const j=await (await fetch(u)).json(); const d=j.daily; const days={};
  d.time.forEach((t,i)=>{days[t]={hi:Math.round(d.temperature_2m_max[i]),lo:Math.round(d.temperature_2m_min[i]),pop:d.precipitation_probability_max[i],code:d.weathercode[i]}});
  WX={at:Date.now(),days}; try{localStorage.setItem(WX_KEY,JSON.stringify(WX))}catch(e){}
 }catch(e){ WX=WX||{at:0,days:{},err:true}; }
 renderWx(); return WX;
}
function renderWx(){
 const el=document.getElementById('wx-strip'); if(!el) return;
 if(!WX||!Object.keys(WX.days||{}).length){ el.innerHTML=`<span class="wx-note">${WX&&WX.err?'예보를 못 가져왔어요':'도쿄 예보 불러오는 중…'}</span>`; if(!WX||!WX.err) loadWeather(); return; }
 el.innerHTML=DAYS.map(d=>{const w=WX.days[d.date]; if(!w) return ''; return `<button type="button" class="wx-day" data-date="${d.date}" aria-pressed="${d.date===state.day}"><span class="wd">${d.date.slice(8)}일 ${d.w}</span><span class="wi">${wxIcon(w.code)}</span><span class="wt"><b>${w.hi}°</b>/${w.lo}°</span>${w.pop>=30?`<span class="wp">☔${w.pop}%</span>`:''}</button>`}).join('')+`<span class="wx-note">도쿄 예보 · ${new Date(WX.at).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})} 기준</span>`;
 el.querySelectorAll('.wx-day').forEach(b=>b.onclick=()=>{state.day=b.dataset.date; save(); render();});
 const on=el.querySelector('.wx-day[aria-pressed="true"]'); if(on&&el.scrollWidth>el.clientWidth){ const r=on.getBoundingClientRect(), c=el.getBoundingClientRect(); el.scrollLeft+= (r.left+r.width/2)-(c.left+c.width/2); }
 if(Date.now()-WX.at>=30*60e3) loadWeather();
}
/* ---------- RENDER: plan ---------- */
function detHtml(d){
 return d.map(x=>{
  if(typeof x==='string') return `<p>${nl(x)}</p>`;
  if(x.k) return `<div class="k">${esc(x.k)}</div>`;
  if(x.l) return `<p><a href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.l)} ↗</a></p>`;
  return '';
 }).join('');
}
const linksHtml=ls=>(Array.isArray(ls)&&ls.length)?ls.filter(x=>x&&x.u).map(x=>`<a class="btn link" href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.l||x.u.replace(/^https?:\/\//,'').slice(0,30))} ↗</a>`).join(''):'';
const dirUrl=(fq,tq,mode)=>'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(fq)+'&destination='+encodeURIComponent(tq)+'&travelmode='+(mode||'transit');
function routeHtml(r){
 if(!r) return '';
 return (Array.isArray(r)?r:[r]).map(x=>`<div class="route"><span class="rf">${x.mode==='walking'?'🚶':x.mode==='driving'?'🚕':'🚃'} ${esc(x.f)} → ${esc(x.t)}${x.price?` <span class="rprice">${esc(x.price)}</span>`:''}</span>${x.how?`<span class="rh">${nl(x.how)}</span>`:''}<span class="racts">${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">구글맵으로 이동하기 ↗</a>`:`<a href="${dirUrl(x.fq||x.f,x.tq||x.t,x.mode)}" target="_blank" rel="noopener">구글맵 경로 보기 ↗</a>`}</span></div>`).join('');
}
function renderPlan(){
 const box=document.getElementById('p-plan');
 const days=getDays(); const day=days.find(d=>d.date===state.day)||days[0];
 box.innerHTML=`<div class="toolrow"><button type="button" class="btn tool" id="outfit-btn">기온별 옷차림</button><button type="button" class="btn tool" id="restrict-btn">기내 반입 제한물품</button><button type="button" class="btn tool" id="kcustoms-btn">한국 반입 주의</button><button type="button" class="btn tool" id="esim-btn">eSIM 설치 가이드</button><div class="wx" id="wx-strip"></div></div><div class="sec-h"><h2>${day.n}일차 · ${day.date.slice(5).replace('-','월 ')}일 ${day.w}요일</h2><span class="cnt">${day.items.length}개</span></div><div class="tl"></div>`;
 box.querySelector('#outfit-btn').onclick=()=>openLightbox('img/outfit.png','기온별 옷차림');
 box.querySelector('#restrict-btn').onclick=()=>openInfo('기내 반입 제한물품',RESTRICTED_HTML);
 box.querySelector('#kcustoms-btn').onclick=()=>{openInfo('일본에서 사 올 때 주의 (한국 반입)',kcHtml()); bindKc(document.getElementById('infobox'));};
 box.querySelector('#esim-btn').onclick=()=>openInfo('eSIM 설치 가이드 (iPhone)','<p class="ib-note">아래로 스크롤하면서 순서대로 따라 하면 돼요. 한국에서는 설치만 하고 데이터 로밍은 하네다 도착 후에 켜기.</p><img class="ib-img" src="img/esim-guide-ios.jpg" alt="iPhone eSIM 설치 가이드" loading="lazy">');
 renderWx();
 const tl=box.querySelector('.tl');
 day.items.forEach((it,i)=>{
  const id=it.id||day.date+'-'+i; const open=!!state.open[id];
  const el=document.createElement('article'); el.className='ev'+(it.big?' big':''); if(it.id)el.dataset.eid=it.id;
  el.innerHTML=`<div class="t">${esc(it.t||'')}${it.ts?`<small>${esc(it.ts)}</small>`:''}</div>
   <div class="b">
    <div class="place">${it.p?`<span>${esc(it.p)}</span>`:''}${(it.pills||[]).map(p=>`<span class="pill ${/예약|필수|도착/.test(p)?'warn':'acc'}">${esc(p)}</span>`).join('')}</div>
    <div class="title">${esc(it.title)}</div>
    ${routeHtml(it.r)}
    ${linksHtml(it.links)?`<div class="acts">${linksHtml(it.links)}</div>`:''}
    ${Array.isArray(it.images)&&it.images.length?`<div class="evimgs">${it.images.map(id=>`<span class="lgthumb">${window.Ledger?Ledger.imgTag(id):''}</span>`).join('')}</div>`:''}
    ${it.d&&it.d.length?`<button class="more" aria-expanded="${open}">자세히</button><div class="det" ${open?'':'hidden'}>${detHtml(it.d)}</div>`:''}
   </div>`;
  const btn=el.querySelector('.more');
  if(btn) btn.onclick=()=>{ const det=el.querySelector('.det'); det.hidden=!det.hidden; btn.setAttribute('aria-expanded',String(!det.hidden)); state.open[id]=!det.hidden; save(); };
  tl.appendChild(el);
 });
}

/* ---------- RENDER: cards ---------- */
function cardHtml(item,id){
 const done=!!state.done[id];
 const meta=[];
 if(item.area&&item.area!==item.g) meta.push(`<span class="pill">${esc(item.area)}</span>`);
 if(item.k) meta.push(`<span>${esc(item.k)}</span>`);
 if(item.pr) meta.push(`<span>${esc(item.pr)}</span>`);
 if(item.s) meta.push(`<span class="stars">${'★'.repeat(item.s)}${'☆'.repeat(5-item.s)}</span>`);
 if(item.h||item.closed) meta.push(`<span class="h">${esc([item.h,item.closed].filter(Boolean).join(' · '))}</span>`);
 const note=[item.loc,item.note].filter(Boolean).join('\n');
 return `<article class="card${done?' done':''}" data-id="${esc(id)}"${item.id?` data-eid="${esc(item.id)}"`:''}>
  <div class="n">${esc(item.n)}${item.tag?` <span class="pill tag">${esc(item.tag)}</span>`:''}${item.res?` <span class="pill warn">${esc(item.res)}</span>`:''}${item.u?` <span class="pill mute">영업 확인 필요</span>`:''}</div>
  <button class="chk" aria-label="다녀옴 표시" aria-pressed="${done}">✓</button>
  <div class="meta">${meta.join('')}</div>
  ${note?`<div class="note">${nl(note)}</div>`:''}
  <div class="acts"><a class="btn map" href="${mapUrl(item.q||item.n+' 東京')}" target="_blank" rel="noopener">지도 열기 ↗</a>${item.link?`<a class="btn link" href="${esc(item.link)}" target="_blank" rel="noopener">링크 ↗</a>`:''}${linksHtml(item.links)}</div>
 </article>`;
}
function bindCards(root){
 root.querySelectorAll('.card .note').forEach(n=>{
  const toggle=()=>{ n.classList.toggle('open'); const b=n.nextElementSibling; if(b&&b.classList.contains('more-btn')) b.textContent=n.classList.contains('open')?'접기 ▴':'더보기 ▾'; };
  n.onclick=e=>{ if(e.target.closest('a'))return; toggle(); };
  // 3줄 넘게 잘린 메모에만 '더보기' 버튼
  requestAnimationFrame(()=>{ if(n.classList.contains('open')||n.nextElementSibling?.classList.contains('more-btn'))return; if(n.scrollHeight>n.clientHeight+2){ const b=document.createElement('button'); b.type='button'; b.className='more-btn'; b.textContent='더보기 ▾'; b.onclick=e=>{e.stopPropagation(); toggle();}; n.after(b); } });
 });
 root.querySelectorAll('.chk').forEach(b=>b.onclick=()=>{
  const card=b.closest('.card'); const id=card.dataset.id;
  state.done[id]=!state.done[id]; if(!state.done[id]) delete state.done[id]; save();
  card.classList.toggle('done',!!state.done[id]); b.setAttribute('aria-pressed',String(!!state.done[id]));
 });
}
function renderTypeSeg(){
 const seg=document.getElementById('ftype'); seg.innerHTML='';
 FOOD_TYPES.forEach(t=>{
  const n=getFood().filter(f=>(state.farea==='전체'||f.a===state.farea)&&(t.id==='전체'||foodType(f)===t.id)&&tagMatch(f)).length;
  const b=document.createElement('button'); b.setAttribute('aria-pressed',String(state.ftype===t.id));
  b.innerHTML=esc(t.label)+`<span class="sub">${n}</span>`;
  b.onclick=()=>{ state.ftype=t.id; save(); render(); };
  seg.appendChild(b);
 });
}
const tagMatch=f=>state.ftag==='전체'||(f.tag||'')===state.ftag;
function renderTagSeg(){
 const seg=document.getElementById('ftag'); seg.innerHTML='';
 const tags=[...new Set(getFood().map(f=>f.tag).filter(Boolean))];
 if(!tags.length){ seg.style.display='none'; if(state.ftag!=='전체'){state.ftag='전체';save();} return; }
 seg.style.display='';
 if(state.ftag!=='전체'&&!tags.includes(state.ftag)){ state.ftag='전체'; save(); }
 ['전체',...tags].forEach(t=>{
  const n=getFood().filter(f=>(state.farea==='전체'||f.a===state.farea)&&(state.ftype==='전체'||foodType(f)===state.ftype)&&(t==='전체'||(f.tag||'')===t)).length;
  const b=document.createElement('button'); b.setAttribute('aria-pressed',String(state.ftag===t));
  b.innerHTML=esc(t)+`<span class="sub">${n}</span>`;
  b.onclick=()=>{ state.ftag=t; save(); render(); };
  seg.appendChild(b);
 });
}
function typeBlocks(items){
 if(state.ftype!=='전체') return `<div class="cards">${items.map(f=>cardHtml(f,'f:'+f.n)).join('')}</div>`;
 return FOOD_TYPES.slice(1).map(t=>{
  const sub=items.filter(f=>foodType(f)===t.id); if(!sub.length) return '';
  return `<div class="type-h">${esc(t.label)} <span class="cnt">${sub.length}</span></div><div class="cards">${sub.map(f=>cardHtml(f,'f:'+f.n)).join('')}</div>`;
 }).join('');
}
function renderFood(){
 renderTypeSeg(); renderTagSeg();
 const q=(document.getElementById('q-food').value||'').trim().toLowerCase();
 const box=document.getElementById('food-list');
 const list=getFood().filter(f=>(state.farea==='전체'||f.a===state.farea)&&(state.ftype==='전체'||foodType(f)===state.ftype)&&tagMatch(f)&&(!q||[f.n,f.k,f.note,f.a,f.loc,f.tag,f.closed,f.pr].join(' ').toLowerCase().includes(q)));
 if(!list.length){box.style.display='';box.innerHTML='<div class="empty">검색 결과가 없어요</div>';return}
 box.style.display='block'; box.innerHTML='';
 if(q){ box.innerHTML=`<div class="cards">${list.map(f=>cardHtml(f,'f:'+f.n)).join('')}</div>`; bindCards(box); return; }
 const areas=state.farea==='전체'?FOOD_AREAS:[state.farea];
 areas.forEach(a=>{
  const sub=list.filter(f=>f.a===a); if(!sub.length) return;
  const w=document.createElement('div');
  w.innerHTML=(state.farea==='전체'?`<div class="sec-h"><h2>${esc(a)}</h2><span class="cnt">${sub.length}</span></div>`:'')+typeBlocks(sub);
  box.appendChild(w);
 });
 bindCards(box);
}
function renderPlace(){
 const q=(document.getElementById('q-place').value||'').trim().toLowerCase();
 const box=document.getElementById('place-list');
 const list=getPlaces().filter(p=>placeMatch(p,state.pgroup)&&(!q||[p.n,p.k,p.loc,p.g,p.area,p.tag,p.res].join(' ').toLowerCase().includes(q)));
 if(!list.length){box.innerHTML='<div class="empty">검색 결과가 없어요</div>';return}
 box.innerHTML='';
 PLACE_GROUPS.forEach(g=>{
  const sub=list.filter(p=>p.g===g); if(!sub.length) return;
  const w=document.createElement('div');
  w.innerHTML=`<div class="sec-h"><h2>${esc(g)}</h2><span class="cnt">${sub.length}</span></div><div class="cards">${sub.map(p=>cardHtml(p,'p:'+p.n)).join('')}</div>`;
  box.appendChild(w);
 });
 bindCards(box);
}

/* ---------- RENDER: memo ---------- */
/* 예전의 정적 메모 카드(항공편·숙소·이동·스튜디오·선물·쇼핑)는 공용 메모로 옮겨져서(notes-seed.js) 여기선 그릴 게 없다 */
function renderMemo(){ const box=document.getElementById('memo-body'); if(box)box.innerHTML=''; }

function render(){
 document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+state.tab);
 document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===state.tab)));
 renderChips();
 if(state.tab==='plan') renderPlan();
 else if(state.tab==='food') renderFood();
 else if(state.tab==='place') renderPlace();
 else if(state.tab==='memo') renderMemo();
 if(window.Content&&Content.decorate)Content.decorate();
}
window.TripSite={state,render,renderChips,setContent:c=>{DB=c||{};render()},DAYS,FOOD,FOOD_EXTRA,PLACES,FOOD_AREAS,FOOD_TYPES,PLACE_GROUPS,PLACE_CHIPS,esc,nl,mapUrl,save};
document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; save(); render(); window.scrollTo({top:0}); });
/* 일정 탭: 좌우로 쓸면 전날/다음날로 (예보·날짜 칩도 같이 바뀜). 예보 줄·가로 스크롤 영역 위에서는 제외 */
(function(){
 const panel=document.getElementById('p-plan'); let sx=0,sy=0,st=0,ok=false;
 panel.addEventListener('touchstart',e=>{ const t=e.touches[0]; ok=!e.target.closest('.wx,.toolrow,.route a,.btn,button,input,textarea'); sx=t.clientX; sy=t.clientY; st=Date.now(); },{passive:true});
 panel.addEventListener('touchend',e=>{ if(!ok||document.body.classList.contains('lgnoselect'))return; const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy; if(Date.now()-st>700||Math.abs(dx)<70||Math.abs(dy)>50||Math.abs(dx)<Math.abs(dy)*1.5)return;
  const i=DAYS.findIndex(d=>d.date===state.day); const j=dx<0?i+1:i-1; if(j<0||j>=DAYS.length)return; state.day=DAYS[j].date; save(); render(); window.scrollTo({top:0}); },{passive:true});
})();
document.getElementById('q-food').addEventListener('input',renderFood);
document.getElementById('q-place').addEventListener('input',renderPlace);

/* auto-pick today's day while traveling, else remembered or day 1 */
(function(){
 const t=todayStr();
 if(DAYS.some(d=>d.date===t)) state.day=t;
 else if(!DAYS.some(d=>d.date===state.day)) state.day=DAYS[0].date;
 const h=(location.hash||'').slice(1); if(['plan','food','place','memo'].includes(h)) state.tab=h;
})();
render();
</script>
<script src="notes-seed.js" defer></script>
<script src="ledger.js" defer></script>
<script src="content.js" defer></script>
