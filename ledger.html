<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F5F8">
<title>도쿄 정산 노트 · 도쿄 덕질 여행 10.24</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --fg:#171C28; --muted:#6B7280; --line:#E2E5EC;
  --accent:#D9372B; --accent-fg:#FFFFFF; --accent-soft:#FBE9E6;
  --ok:#1E8E5A; --ok-soft:#E3F3EA; --warn:#B7791F; --warn-soft:#FBF1DC;
  --chip:#EBEDF2; --chip-on:#171C28; --chip-on-fg:#FFFFFF;
  --shadow:0 1px 2px rgba(23,28,40,.06),0 6px 16px rgba(23,28,40,.05);
  --scrim:rgba(23,28,40,.45);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --tab-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1B1F28; --fg:#E9EBF1; --muted:#9AA1B0; --line:#2B3140;
  --accent:#F05A4D; --accent-fg:#FFFFFF; --accent-soft:#3A1F1D;
  --ok:#4CC38A; --ok-soft:#173226; --warn:#E0A94B; --warn-soft:#352A14;
  --chip:#262B36; --chip-on:#E9EBF1; --chip-on-fg:#12151C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1B1F28; --fg:#E9EBF1; --muted:#9AA1B0; --line:#2B3140;
  --accent:#F05A4D; --accent-fg:#FFFFFF; --accent-soft:#3A1F1D;
  --ok:#4CC38A; --ok-soft:#173226; --warn:#E0A94B; --warn-soft:#352A14;
  --chip:#262B36; --chip-on:#E9EBF1; --chip-on-fg:#12151C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}
.wrap{max-width:560px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{font-family:var(--mono);font-weight:500;color:var(--muted);margin-left:6px;font-size:12px}
.icon-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--surface);box-shadow:var(--shadow)}
.icon-btn svg{width:18px;height:18px}
.who{display:flex;gap:6px;align-items:center;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.who::-webkit-scrollbar{display:none}
.who .lbl{font-size:12px;color:var(--muted);flex-shrink:0;letter-spacing:.02em}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;height:30px;padding:0 12px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-fg)}
.chip.sm{height:26px;padding:0 10px;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.chips.scroll::-webkit-scrollbar{display:none}

/* banners */
.banner{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--fg);font-size:13px;display:flex;gap:8px;align-items:flex-start}
.banner.ok{background:var(--ok-soft)}
.banner.accent{background:var(--accent-soft)}
.banner b{font-weight:600}

/* cards */
.card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:14px 14px;margin:10px 0}
.card h2{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat > div{min-width:0}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:20px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 0 6px}
.sec h3{font-size:14px;font-weight:600}
.sec .num{font-size:13px;color:var(--muted)}

/* expense rows */
.row{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
.row .cat{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:11px;font-weight:600;flex-shrink:0;color:var(--muted)}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--muted);margin-top:1px}
.row .s .me{color:var(--accent);font-weight:600}
.row .amt{text-align:right;flex-shrink:0}
.row .amt .a{font-family:var(--mono);font-weight:600;font-size:15px}
.row .amt .b{font-size:11px;color:var(--muted);font-family:var(--mono)}
.row .amt .b.owe{color:var(--accent);font-weight:600}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px}
.empty b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}

/* checklist */
.ck{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ck:first-child{border-top:0}
.ck .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;margin-top:1px;display:grid;place-items:center;background:var(--surface)}
.ck .box svg{width:14px;height:14px;display:none}
.ck.done .box{background:var(--ok);border-color:var(--ok)}
.ck.done .box svg{display:block}
.ck .body{flex:1;min-width:0;text-align:left}
.ck .txt{font-weight:500}
.ck.done .txt{color:var(--muted);text-decoration:line-through}
.ck .memo{font-size:12.5px;color:var(--muted);white-space:pre-wrap;margin-top:2px;padding-left:8px;border-left:2px solid var(--line)}
.ck .tag{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.addrow{display:flex;gap:8px;margin:8px 0 4px}
.addrow input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.addrow button{height:44px;padding:0 14px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600}

/* settle */
.flow{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.flow:first-child{border-top:0}
.flow .p{font-weight:600}
.flow .arr{color:var(--muted)}
.flow .amt{margin-left:auto;font-family:var(--mono);font-weight:600;font-size:16px}
.flow .amt.in{color:var(--ok)}
.flow .amt.out{color:var(--accent)}
.flow button.mini{height:30px;padding:0 10px;border-radius:8px;background:var(--chip);font-size:12px;font-weight:600;flex-shrink:0}
.bal{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;padding:6px 0}
.bal .n{font-weight:500}
.bal .v{font-family:var(--mono);text-align:right}
.bal .v.pos{color:var(--ok)} .bal .v.neg{color:var(--accent)}
.sub{font-size:12px;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;height:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:600;height:var(--tab-h)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-selected="true"]{color:var(--accent)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));z-index:6;height:50px;padding:0 18px 0 14px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(217,55,43,.35);display:flex;align-items:center;gap:6px}
.fab svg{width:20px;height:20px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:92dvh;overflow:auto;transform:translateY(105%);transition:transform .22s cubic-bezier(.2,.8,.2,1);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet.open{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:17px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.sheet h2 button{font-size:13px;color:var(--muted);font-weight:500}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
.f input[type=text],.f input[type=number],.f textarea,.f select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.f textarea{height:auto;min-height:72px;padding:10px 12px;resize:vertical}
.amount{display:flex;gap:8px;align-items:stretch}
.amount input{flex:1;min-width:0;height:56px !important;font-size:28px;font-family:var(--mono);font-weight:600;padding:0 14px !important;text-align:right}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex-shrink:0}
.seg button{padding:0 14px;font-weight:600;font-family:var(--mono);font-size:15px;background:var(--bg)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.people-amts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.people-amts label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.people-amts input{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font-family:var(--mono);text-align:right;width:100%}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.hint.bad{color:var(--accent)}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{height:48px;border-radius:14px;font-weight:700;font-size:15px;padding:0 18px;flex:1}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:var(--chip);color:var(--fg);flex:0 0 auto}
.btn.danger{background:none;color:var(--accent);flex:0 0 auto}
.btn:disabled{opacity:.5;cursor:default}
.toggle{display:flex;align-items:center;justify-content:space-between;height:44px}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.people-list{display:flex;flex-direction:column;gap:8px}
.people-list .pr{display:flex;gap:8px;align-items:center}
.people-list input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
.people-list .mark{font-size:12px;color:var(--muted);flex-shrink:0;width:52px;text-align:right}
.linkish{color:var(--accent);font-weight:600;font-size:13px}
.back{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 10px 0 6px;border-radius:10px;color:var(--muted);font-size:13px;font-weight:600;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;flex-shrink:0}
.back svg{width:16px;height:16px}
.top-row .left{display:flex;align-items:center;gap:8px;min-width:0}
.brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinbox input{font-family:var(--mono);font-size:24px;letter-spacing:.3em;text-align:center;height:56px !important}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="left"><a class="back" href="./" aria-label="여행 사이트로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>여행</a>
      <h1 class="brand">정산 노트 <small>10.24–28</small></h1></div>
      <button class="icon-btn" id="btnSettings" aria-label="설정">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
    <div class="who" id="who"></div>
  </header>
  <div id="banners"></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>지출 추가
</button>

<nav class="tabs" aria-label="메뉴"><div class="in" id="tabbar"></div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- constants ---------- */
/* 저장소 API (api/ledger.js — Vercel 서버 함수 + Neon). 같은 도메인이라 상대 경로 */
const API_URL = '/api/ledger';
const POLL_MS = 12000;
const DAYS=[
  {d:'2026-10-24',n:1,w:'토',s:'10/24'},
  {d:'2026-10-25',n:2,w:'일',s:'10/25'},
  {d:'2026-10-26',n:3,w:'월',s:'10/26'},
  {d:'2026-10-27',n:4,w:'화',s:'10/27'},
  {d:'2026-10-28',n:5,w:'수',s:'10/28'},
];
const PRE={d:'pre',n:0,w:'',s:'출발 전'};
const ALLDAYS=[PRE,...DAYS];
const CATS=['식비','교통','덕질','쇼핑','입장','숙소','기타'];
const CUR={JPY:{sym:'¥',dec:0},KRW:{sym:'₩',dec:0}};
const TABS=[
  {id:'exp',label:'지출',icon:'<path d="M3 7h18v12H3z"/><path d="M3 11h18"/><circle cx="16.5" cy="15" r="1.2"/>'},
  {id:'settle',label:'정산',icon:'<path d="M7 7h11l-3-3M17 17H6l3 3"/>'},
  {id:'check',label:'체크',icon:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'},
];

/* ---------- state ---------- */
const S={tab:'exp',me:null,people:[],rate:9.2,settingsLoaded:false,hasSettings:false,
  expenses:[],checks:[],transfers:[],db:null,canWrite:null,writeRefused:false,pinNeeded:false,loadError:'',saving:0,
  dayFilter:'all',ckFilter:'all',ckScope:'shared',connected:false,dbMissing:false};
try{const t=localStorage.getItem('tl_tab'); if(t&&TABS.some(x=>x.id===t)) S.tab=t;}catch(e){}
try{const m=localStorage.getItem('tl_me'); if(m!==null&&m!=='') S.me=+m;}catch(e){}

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,cur='JPY')=>{const c=CUR[cur]||CUR.JPY;const v=Math.round(Math.abs(n));return (n<0?'-':'')+c.sym+v.toLocaleString('ko-KR')};
const parseNum=s=>{const v=parseFloat(String(s).replace(/[^\d.\-]/g,''));return isFinite(v)?v:0};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const todayKey=()=>{const d=new Date();const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return DAYS.some(x=>x.d===k)?k:(k<DAYS[0].d?'pre':DAYS[DAYS.length-1].d)};
const dayOf=k=>ALLDAYS.find(x=>x.d===k)||PRE;
const dayLabel=k=>{const d=dayOf(k);return d.d==='pre'?'출발 전':`D${d.n} ${d.s} ${d.w}`};
const pname=i=>(S.people[i]&&S.people[i].name)||`멤버${i+1}`;
const canWrite=()=>!!S.db&&S.canWrite!==false&&!S.writeRefused;
let toastT; const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800)};
const svgCheck='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

/* 분담 계산: 각자 몫(통화 그대로) */
function sharesOf(e){
  const n=S.people.length||2; const out=new Array(n).fill(0);
  const parts=(e.parts&&e.parts.length?e.parts:[...Array(n).keys()]).filter(i=>i<n);
  if(e.custom&&typeof e.custom==='object'){
    parts.forEach(i=>out[i]=+e.custom[i]||0);
    const sum=out.reduce((a,b)=>a+b,0); const rest=e.amount-sum;
    if(Math.abs(rest)>0.001&&parts.length) out[parts[0]]+=rest; // 남는 금액은 첫 참여자에게
    return out;
  }
  if(!parts.length) return out;
  parts.forEach(i=>out[i]=e.amount/parts.length);
  return out;
}
/* 통화별 잔액: +면 받을 돈, -면 줄 돈 */
function balances(cur){
  const n=S.people.length; const b=new Array(n).fill(0);
  S.expenses.filter(e=>e.cur===cur).forEach(e=>{
    if(e.payer<n) b[e.payer]+=e.amount;
    sharesOf(e).forEach((s,i)=>{if(i<n)b[i]-=s});
  });
  S.transfers.filter(t=>t.cur===cur).forEach(t=>{ if(t.from<n)b[t.from]+=t.amount; if(t.to<n)b[t.to]-=t.amount; });
  return b;
}
function flows(cur){
  const b=balances(cur).map((v,i)=>({i,v}));
  const cred=b.filter(x=>x.v>0.5).sort((a,b)=>b.v-a.v).map(x=>({...x}));
  const debt=b.filter(x=>x.v<-0.5).sort((a,b)=>a.v-b.v).map(x=>({...x,v:-x.v}));
  const out=[]; let ci=0,di=0;
  while(ci<cred.length&&di<debt.length){
    const m=Math.min(cred[ci].v,debt[di].v);
    out.push({from:debt[di].i,to:cred[ci].i,amount:m});
    cred[ci].v-=m; debt[di].v-=m;
    if(cred[ci].v<0.5)ci++; if(debt[di].v<0.5)di++;
  }
  return out;
}
function totals(cur,who){ // who: null=전체
  let paid=0,share=0,all=0;
  S.expenses.filter(e=>e.cur===cur).forEach(e=>{
    all+=e.amount;
    if(who!=null){ if(e.payer===who)paid+=e.amount; share+=sharesOf(e)[who]||0; }
  });
  return {paid,share,all};
}

/* ---------- store: 구글 시트 Apps Script ---------- */
const getPin=()=>{try{return localStorage.getItem('tl_pin')||''}catch(e){return ''}};
const setPin=v=>{try{localStorage.setItem('tl_pin',v)}catch(e){}};
const RAW={settings:{},expenses:{},transfers:{},checks:{}};
function rebuild(){
  const st=RAW.settings.trip;
  S.settingsLoaded=true;
  if(st){S.hasSettings=true;S.people=Array.isArray(st.people)?st.people.map(p=>({name:String(p.name||''),uid:''})):[];S.rate=+st.rate||S.rate}
  else{S.hasSettings=false;S.people=[]}
  if(S.me!==null&&S.me>=S.people.length)S.me=null;
  S.expenses=Object.entries(RAW.expenses).map(([id,e])=>({id,...e,amount:+e.amount||0,payer:+e.payer||0,parts:Array.isArray(e.parts)?e.parts.map(Number):[]}));
  S.transfers=Object.entries(RAW.transfers).map(([id,t])=>({id,...t,amount:+t.amount||0,from:+t.from||0,to:+t.to||0}));
  S.checks=Object.entries(RAW.checks).map(([id,c])=>({id,...c}));
}
function localApply(op){
  const col=RAW[op.col]; if(!col)return;
  if(op.op==='delete')delete col[op.id];
  else if(op.op==='update')col[op.id]={...(col[op.id]||{}),...op.data};
  else col[op.id]={...op.data};
  rebuild();render();
}
const Store={
  async call(body,method){
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),20000);
    try{
      const res=method==='GET'
        ?await fetch(API_URL+'?action=list&pin='+encodeURIComponent(getPin())+'&_='+Date.now(),{signal:ctrl.signal,redirect:'follow'})
        :await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...body,pin:getPin()}),signal:ctrl.signal,redirect:'follow'});
      const j=await res.json();
      if(!j.ok) throw {code:j.error==='pin'?'pin':'server',message:j.error||'server'};
      return j;
    }catch(e){ if(e&&e.code)throw e; throw {code:'network',message:String(e&&e.message||e)} }
    finally{clearTimeout(t)}
  },
  loading:false,
  async load(){
    if(!API_URL||this.loading)return; this.loading=true;
    try{
      const j=await this.call(null,'GET');
      ['settings','expenses','transfers','checks'].forEach(k=>{RAW[k]=(j.data&&j.data[k])||{}});
      const first=!S.db; S.db=makeDb(); S.canWrite=true; S.dbMissing=false; S.pinNeeded=false; S.loadError='';
      rebuild(); render();
      if(first&&!S.hasSettings&&!$('#sheet').classList.contains('open'))openSettings();
    }catch(e){
      if(e.code==='pin'){S.pinNeeded=true;S.db=null;render();if(!$('#sheet').classList.contains('open'))openPin()}
      else{S.dbMissing=true;S.loadError=e.code==='network'?'네트워크 오류예요. 로컬 미리보기(localhost)에서는 서버 API가 없어서 연결되지 않아요.':String(e.message||'');S.db=null;render()}
    }finally{this.loading=false}
  },
  async send(ops){ S.saving++; try{return await this.call({action:'write',ops},'POST')} finally{S.saving--} }
};
function makeDb(){
  const docRef=(col,id)=>({id,path:col+'/'+id,
    set:async data=>{localApply({op:'set',col,id,data});await Store.send([{op:'set',col,id,data}])},
    update:async data=>{localApply({op:'update',col,id,data});await Store.send([{op:'update',col,id,data}])},
    delete:async()=>{localApply({op:'delete',col,id});await Store.send([{op:'delete',col,id}])}});
  return {doc:p=>{const [c,i]=p.split('/');return docRef(c,i)},
    collection:c=>({add:async data=>{const r=docRef(c,uid());await r.set(data);return r},doc:id=>docRef(c,id||uid())})};
}
function openPin(){
  const h=`<div class="grab"></div><h2>비밀번호<button type="button" id="shClose">닫기</button></h2>
  <form id="pinForm"><div class="f pinbox"><label>정산 노트 공용 비밀번호</label><input type="text" inputmode="numeric" autocomplete="off" id="pinInput" value="${esc(getPin())}" placeholder="····"></div>
  <div class="hint">사이트 주인이 정한 숫자예요. 한 번 넣으면 이 폰에 기억돼요.</div>
  <div class="actions"><button type="submit" class="btn primary">확인</button></div></form>`;
  openSheet(h); const q=s=>document.querySelector(s);
  q('#shClose').onclick=closeSheet;
  q('#pinForm').onsubmit=async ev=>{ev.preventDefault();setPin(q('#pinInput').value.trim());closeSheet();await Store.load();if(S.pinNeeded)toast('비밀번호가 맞지 않아요')};
  setTimeout(()=>q('#pinInput').focus(),250);
}
