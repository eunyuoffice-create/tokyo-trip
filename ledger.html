<!doctype html>
<html lang="ko">
<head>

<title>정산 노트 · 도쿄 덕질 여행 10.24</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#F4F5F8;--surface:#FFFFFF;--fg:#171C28;--muted:#6B7280;--line:#E2E5EC;--accent:#D9372B;--accent-fg:#FFFFFF;--accent-soft:#FBE9E6;--ok:#1E8E5A;--ok-soft:#E3F3EA;--warn:#B7791F;--warn-soft:#FBF1DC;--chip:#EBEDF2;--shadow:0 1px 2px rgba(23,28,40,.06),0 6px 16px rgba(23,28,40,.05);--sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--tab-h:0px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12151C;--surface:#1B1F28;--fg:#E9EBF1;--muted:#9AA1B0;--line:#2B3140;--accent:#F05A4D;--accent-soft:#3A1F1D;--ok:#4CC38A;--ok-soft:#173226;--warn:#E0A94B;--warn-soft:#352A14;--chip:#262B36;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151C;--surface:#1B1F28;--fg:#E9EBF1;--muted:#9AA1B0;--line:#2B3140;--accent:#F05A4D;--accent-soft:#3A1F1D;--ok:#4CC38A;--ok-soft:#173226;--warn:#E0A94B;--warn-soft:#352A14;--chip:#262B36;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:560px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;font-weight:600;text-decoration:none;margin-bottom:10px}
</style>
<link rel="stylesheet" href="ledger.css">
</head>
